name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Set project version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s|</PropertyGroup>|  <Version>$VERSION</Version>\n  </PropertyGroup>|" src/CameraCopier/CameraCopier.csproj

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal

      - name: Publish (linux-x64)
        run: >
          dotnet publish src/CameraCopier/CameraCopier.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish/linux-x64

      - name: Publish (win-x64)
        run: >
          dotnet publish src/CameraCopier/CameraCopier.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish/win-x64

      - name: Publish (osx-x64)
        run: >
          dotnet publish src/CameraCopier/CameraCopier.csproj
          --configuration Release
          --runtime osx-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish/osx-x64

      - name: Package artifacts
        run: |
          cd publish
          zip -r camera-copier-linux-x64.zip linux-x64/
          zip -r camera-copier-win-x64.zip win-x64/
          zip -r camera-copier-osx-x64.zip osx-x64/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Camera Copier ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            publish/camera-copier-linux-x64.zip
            publish/camera-copier-win-x64.zip
            publish/camera-copier-osx-x64.zip
