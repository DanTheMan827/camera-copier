name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-13
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal

      - name: Publish AOT
        run: >
          dotnet publish src/CameraCopier/CameraCopier.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          -p:PublishAot=true
          -p:Version=${{ steps.version.outputs.version }}
          --output publish/

      - name: Archive artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd publish
          zip -r ../camera-copier-${{ matrix.rid }}.zip .

      - name: Archive artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath camera-copier-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-copier-${{ matrix.rid }}
          path: camera-copier-${{ matrix.rid }}.zip

  macos-universal:
    needs: build
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Download osx-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: camera-copier-osx-x64
          path: osx-x64-zip/

      - name: Download osx-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: camera-copier-osx-arm64
          path: osx-arm64-zip/

      - name: Extract archives
        run: |
          unzip -o osx-x64-zip/camera-copier-osx-x64.zip -d osx-x64/
          unzip -o osx-arm64-zip/camera-copier-osx-arm64.zip -d osx-arm64/

      - name: Create universal binary
        run: |
          mkdir -p universal/
          cp -r osx-x64/. universal/
          lipo -create osx-x64/CameraCopier osx-arm64/CameraCopier \
               -output universal/CameraCopier
          chmod +x universal/CameraCopier

      - name: Archive universal binary
        run: |
          cd universal
          zip -r ../camera-copier-osx-universal.zip .

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-copier-osx-universal
          path: camera-copier-osx-universal.zip

  release:
    needs: [build, macos-universal]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Camera Copier ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/camera-copier-linux-x64/camera-copier-linux-x64.zip
            artifacts/camera-copier-win-x64/camera-copier-win-x64.zip
            artifacts/camera-copier-osx-universal/camera-copier-osx-universal.zip
