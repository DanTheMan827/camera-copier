name: CI

on:
  push:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Debug)
        run: dotnet build --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal

      - name: Publish AOT
        run: >
          dotnet publish src/CameraCopier/CameraCopier.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          -p:PublishAot=true
          --output publish/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camera-copier-${{ matrix.rid }}
          path: publish/
          retention-days: 7

  macos:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Debug)
        run: dotnet build --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal

      - name: Publish AOT (osx-arm64)
        run: >
          dotnet publish src/CameraCopier/CameraCopier.csproj
          --configuration Release
          --runtime osx-arm64
          -p:PublishAot=true
          --output publish/osx-arm64/

      - name: Publish AOT (osx-x64)
        run: >
          dotnet publish src/CameraCopier/CameraCopier.csproj
          --configuration Release
          --runtime osx-x64
          -p:PublishAot=true
          --output publish/osx-x64/

      - name: Create universal binary
        run: |
          mkdir -p publish/osx-universal/
          cp -r publish/osx-arm64/. publish/osx-universal/
          lipo -create publish/osx-arm64/CameraCopier publish/osx-x64/CameraCopier \
               -output publish/osx-universal/CameraCopier
          chmod +x publish/osx-universal/CameraCopier

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-copier-osx-universal
          path: publish/osx-universal/
          retention-days: 7
